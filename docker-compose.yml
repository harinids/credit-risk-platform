services:
  db:
    image: postgres:15-alpine
    container_name: credit_risk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - credit_net

  db-init:
    build:
      context: .
      dockerfile: scripts/Dockerfile.loader
    container_name: credit_risk_db_init
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data/raw:/app/data/raw:ro
    networks:
      - credit_net
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: credit_risk_api
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - credit_net
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: credit_risk_ui
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8501:8501"
    networks:
      - credit_net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  credit_net:
    driver: bridge